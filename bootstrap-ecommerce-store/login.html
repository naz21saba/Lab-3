<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NexaStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="bg-white border-bottom shadow-sm">
  <div class="container py-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none text-dark">
        <span class="bg-dark text-white fw-bold rounded-3 px-3 py-2">N</span>
        <span class="fs-4 fw-bold">NexaStore</span>
      </a>

      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
        <a href="index.html" class="text-decoration-none text-dark fw-semibold">Home</a>
        <a href="index.html#products" class="text-decoration-none text-dark fw-semibold">Products</a>
        <a href="index.html#reviews" class="text-decoration-none text-dark fw-semibold">Reviews</a>
        <a href="login.html" class="btn btn-outline-dark rounded-pill px-3">Login</a>
        <a href="signup.html" class="btn btn-dark rounded-pill px-3">Sign Up</a>
        <a href="cart.html" class="btn btn-primary rounded-pill px-3">Cart 🛒</a>
      </div>

    </div>
  </div>
</nav>


<main class="container py-5">

  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">

      <div class="card border-0 shadow rounded-4">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <span class="badge text-bg-dark rounded-pill px-3 py-2 mb-2">WELCOME BACK</span>
            <h1 class="h2 fw-bold">Login</h1>
            <p class="text-secondary">Enter your account details.</p>
          </div>

          <form action="index.html">

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control form-control-lg" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" placeholder="Your password" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">

              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>

              <a href="#" class="small">Forgot password?</a>

            </div>

            <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill">
              Login
            </button>

          </form>

          <p class="text-center text-secondary mt-4 mb-0">
            New customer?
            <a href="signup.html" class="fw-bold">Create account</a>
          </p>

        </div>
      </div>

    </div>
  </div>

</main>


<footer class="bg-dark text-white mt-5">
  <div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>© 2026 NexaStore</span>
      <span class="text-white-50">Bootstrap E-commerce Assignment · No JavaScript</span>
    </div>
  </div>
</footer>


</body>
</html>
