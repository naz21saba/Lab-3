<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Cart — NexaStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="bg-white border-bottom shadow-sm">
  <div class="container py-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">

      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none text-dark">
        <span class="bg-dark text-white fw-bold rounded-3 px-3 py-2">N</span>
        <span class="fs-4 fw-bold">NexaStore</span>
      </a>

      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-3">
        <a href="index.html" class="text-decoration-none text-dark fw-semibold">Home</a>
        <a href="index.html#products" class="text-decoration-none text-dark fw-semibold">Products</a>
        <a href="index.html#reviews" class="text-decoration-none text-dark fw-semibold">Reviews</a>
        <a href="login.html" class="btn btn-outline-dark rounded-pill px-3">Login</a>
        <a href="signup.html" class="btn btn-dark rounded-pill px-3">Sign Up</a>
        <a href="cart.html" class="btn btn-primary rounded-pill px-3">Cart 🛒</a>
      </div>

    </div>
  </div>
</nav>


<main class="container py-5">

  <div class="mb-4">
    <span class="text-primary fw-bold small">EDIT CART</span>
    <h1 class="display-6 fw-bold">Update your items</h1>
  </div>

  <form action="cart.html">

    <div class="card border-0 shadow rounded-4">
      <div class="card-body p-4">

        <div class="row align-items-center g-4 pb-4 border-bottom">

          <div class="col-md-2">
            <img
              src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
              class="img-fluid rounded-3"
              alt="Watch">
          </div>

          <div class="col-md-4">
            <h5 class="fw-bold">Minimal Watch</h5>
            <span class="text-secondary">$59 each</span>
          </div>

          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <select class="form-select">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Action</label>
            <select class="form-select">
              <option>Keep item</option>
              <option>Remove item</option>
            </select>
          </div>

        </div>


        <div class="row align-items-center g-4 pt-4">

          <div class="col-md-2">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
              class="img-fluid rounded-3"
              alt="Headphones">
          </div>

          <div class="col-md-4">
            <h5 class="fw-bold">Studio Headphones</h5>
            <span class="text-secondary">$96 each</span>
          </div>

          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <select class="form-select">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Action</label>
            <select class="form-select">
              <option>Keep item</option>
              <option>Remove item</option>
            </select>
          </div>

        </div>


        <div class="d-flex flex-wrap justify-content-between gap-2 mt-4 pt-4 border-top">

          <a href="cart.html" class="btn btn-outline-dark rounded-pill px-4">
            Cancel
          </a>

          <button type="submit" class="btn btn-dark rounded-pill px-4">
            Save Cart Changes
          </button>

        </div>

      </div>
    </div>

  </form>

</main>


<footer class="bg-dark text-white mt-5">
  <div class="container py-4">
    <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>© 2026 NexaStore</span>
      <span class="text-white-50">Bootstrap E-commerce Assignment · No JavaScript</span>
    </div>
  </div>
</footer>


</body>
</html>
